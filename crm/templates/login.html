{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Bảo Tín Finance – Login</title>
<style>
body{margin:0;font-family:"Segoe UI",Arial;background:#f4f6fb}
.header{
  background:white;display:flex;align-items:center;
  padding:10px 24px;border-bottom:1px solid #ddd
}
.header img{height:34px;margin-right:10px}
.header span{font-weight:600;color:#0f4da2}
.box{
  width:340px;margin:40px auto;padding:30px;
  background:white;border-radius:12px
}
input,button{width:100%;padding:10px;margin-top:10px}
button{background:#ff8c00;color:white;border:none;border-radius:6px}
.err{color:red;text-align:center}
.banner img{width:100%;max-height:220px;object-fit:cover}
</style>
</head>
<body>

<div class="header">
  <img src="{% static 'crm/logo.png' %}">
  <span>Bảo Tín Finance | 0829 133 391</span>
</div>

<div class="banner">
  <img src="{% static 'crm/banner.jpg' %}">
</div>

<div class="box">
<h3>SALE LOGIN</h3>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <input name="username" placeholder="Username">
  <input type="password" name="password" placeholder="Password">
  <button>Đăng nhập</button>
</form>
</div>

</body>
</html>
