name: Telegram Notify 6 Months

on:
  schedule:
    # 8:00 sáng giờ Việt Nam = 1:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Telegram notify
        env:
          DJANGO_SETTINGS_MODULE: crm_project.settings
          PYTHONPATH: .
        run: |
          python manage.py shell -c "from crm.telegram import check_and_notify_6_months; check_and_notify_6_months()"
